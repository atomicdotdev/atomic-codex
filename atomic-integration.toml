schema = 1
agent = "codex"
version = "1.1.0"

[requires]
atomic = ">=0.13.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.codex/skills/{name}/SKILL.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.codex/AGENTS.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[[file]]
src = "skills/decision-record/SKILL.md"
dst = "~/.codex/skills/decision-record/SKILL.md"

[[settings]]
manifest = "hooks/codex.atomic-hooks.json"
